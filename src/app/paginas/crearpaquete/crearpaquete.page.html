<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Paquetes</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="" (click)="back()" text="" class="dorado"></ion-back-button>
    </ion-buttons>
    @if (idRol == 2) {
      <ion-buttons slot="end">
        <ion-button (click)="agregarPaquete()">
          @if (compania === 'iroda') {
            <ion-icon class="dorado" name="duplicate-outline"></ion-icon>
          }
          @if (compania === 'lua') {
            <ion-icon class="dorado icon-24" slot="icon-only" name="add-mem"></ion-icon>
          }
        </ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>

<ion-content>

  @if (listado?.respuesta == '') {
    <ion-list style="text-align: center;">
      <br>
        <label class="sinPaquete"> Sin paquetes</label>
      </ion-list>
    }

    @if (!listado) {
      <ion-list>
        @for (item of [1,1,1,1,1,1,1]; track item) {
          <ion-item lines="none" style="--background: transparent; background: transparent; box-shadow: none; border: none;">
            <ion-card style="padding:12px; width: 100%; margin: 8px 12px; border-radius: 20px;">
              <ion-grid>
                <ion-row><ion-col><label><ion-skeleton-text animated style="width: 60%; height: 14px; border-radius: 8px;"></ion-skeleton-text></label></ion-col></ion-row>
                <ion-row><ion-col style="margin-top: 5px;"><label><ion-skeleton-text animated style="width: 50%; height: 12px; border-radius: 6px;"></ion-skeleton-text></label></ion-col></ion-row>
                <ion-row><ion-col><label><ion-skeleton-text animated style="width: 45%; height: 10px; border-radius: 999px;"></ion-skeleton-text></label></ion-col></ion-row>
                <ion-row><ion-col><label><ion-skeleton-text animated style="width: 30%; height: 10px; border-radius: 6px;"></ion-skeleton-text></label></ion-col></ion-row>
              </ion-grid>
            </ion-card>
          </ion-item>
        }
      </ion-list>
    } @else {

    <ion-list class="animated slow fadeInLeft">
      @for (Paquete of listado?.respuesta; track Paquete) {
        <ion-item lines="none" color="gray" detail="false"
          class="ion-no-padding">
          <ion-card style="padding:3px;">
            <ion-grid>
              <ion-row>
                <ion-col>
                  <label style="font-weight: bold; font-size: 14px;">
                    Membresia {{Paquete.tipoInscripcionDesc}}
                  </label>
                </ion-col>
              </ion-row>
              <ion-row>
                <ion-col style="margin-top: 5px;" style="font-weight: bold; font-size: 12px;" class="lvencimiento">
                  <label style="font-weight: bold; color: rgb(174, 171, 171); font-size: 12px;">
                  {{Paquete.descripcionTipoPago}} </label>
                </ion-col>
              </ion-row>
              <ion-row>
                <ion-col>
                  <label class="label-membresiavenc" style="font-weight: bold; font-size: 12px;"> {{Paquete.vencimiento}}
                  </label>
                </ion-col>
              </ion-row>
              <ion-row>
                <ion-col>
                  <label class="fechainicio" style="font-weight: bold; color: rgb(174, 171, 171);font-size: 11px;">Fecha de
                  Inicio</label>
                </ion-col>
              </ion-row>
              <ion-row>
                <ion-col>
                  <label style="font-weight: bold; font-size: 12px;" class="fechainicio"
                  format="YYYY-MM-DD">{{Paquete.fechaInicio}}</label>
                </ion-col>
              </ion-row>
              <ion-row>
                <ion-col>
                  <label style="font-weight: bold; font-size: 12px;">
                    Comentarios :
                    {{Paquete.comentario}}
                  </label>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card>
        </ion-item>
      }

    </ion-list>
    }

  </ion-content>
