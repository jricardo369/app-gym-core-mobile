<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="dorado">Asistentes</ion-title>
    <ion-buttons slot="start">
      <ion-back-button class="dorado" defaultHref="" (click)="regresar()" text=""></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-img src="../../assets/img/{{logo}}" class="logo"></ion-img>
  <div style="margin-bottom: 10px;text-align: center;margin-top:10px">

    <label style="font-size: 15px;">Fecha: {{fechaf}}</label><br>
    <label style="font-size: 14px;">
      {{descripcionHorario}}
    </label>
    <br>
      <label class="color-coach" style="font-size: 12px;margin-bottom: 5px;">
        Clase impartida por {{profesorNombre}}
      </label>
      <br>
        <label  class="label-g1">
          {{listado?.respuesta.lugares}}
        </label>

      </div>

      <ion-list class="animated fast fadeInDown">
        @for (Asistentes of listado?.respuesta.usuarios; track Asistentes; let indice = $index) {
          <ion-item lines="none" color="gray" detail="false"
            (click)="ponerFalta(Asistentes.idUsuario, Asistentes.nombre,Asistentes.lugar,Asistentes.asistio)">
            <ion-card style="padding: 2px;">
              <ion-grid>
                <ion-row>
                  <ion-col>
                    @if (Asistentes.sexo == 'M') {
                      <div>
                        <label class="label-lugaresm">{{Asistentes.iniciales}}</label>
                        <label style="font-size: 12px;margin-left: 5px;">
                          {{Asistentes.nombre}}
                        </label>
                        <label class="label-lugar">L{{Asistentes.lugar}}</label>
                        @if (Asistentes.asistio == 'F') {
                          <label class="label-asistio">{{Asistentes.asistio}}</label>
                        }
                      </div>
                    }
                    @if (Asistentes.sexo == 'F') {
                      <div>
                        <label class="label-lugaresf">{{Asistentes.iniciales}}</label>
                        <label style="font-size: 12px;margin-left: 5px;">
                          {{Asistentes.nombre}}
                        </label>
                        <label class="label-lugar">L{{Asistentes.lugar}}</label>
                        @if (Asistentes.asistio == 'F') {
                          <label class="label-asistio">{{Asistentes.asistio}}</label>
                        }
                      </div>
                    }
                  </ion-col>
                </ion-row>
              </ion-grid>
            </ion-card>
          </ion-item>
        }
      </ion-list>
      @if (listado?.respuesta.usuarios.length == 0) {
        <label class="sinclases"> No hay asistentes</label>
      }
    </ion-content>
