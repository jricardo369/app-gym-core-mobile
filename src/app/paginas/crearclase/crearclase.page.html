<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Nueva Clase</ion-title>
    <ion-buttons slot="start">
      <ion-back-button class="dorado" defaultHref="" (click)="atras()" text=""></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="contenido">

  <form #claseNueva="ngForm" novalidate>
    <ion-grid>
      <ion-row>
        <ion-col size-md="6" size-lg="5" size-xs="12">
          <div padding>
            <ion-item lines="none">
              <ion-label position="stacked" style="color:#0f172a; font-weight:700; font-size:12px; margin-bottom:6px; letter-spacing:0.02em;">Nombre de la clase</ion-label>
              <ion-input [(ngModel)]="nc.nombre" name="nombre" type="text" placeholder="Ej. Spinning Avanzado" required></ion-input>
            </ion-item>
            <ion-item lines="none">
              <ion-label position="stacked" style="color:#0f172a; font-weight:700; font-size:12px; margin-bottom:6px;">Hora inicio</ion-label>
              <ion-input [(ngModel)]="nc.horaInicio" name="horaInicio" type="tel" maxlength="2" placeholder="0" required></ion-input>
            </ion-item>
            <ion-item lines="none">
              <ion-label position="stacked" style="color:#0f172a; font-weight:700; font-size:12px; margin-bottom:6px;">Hora fin</ion-label>
              <ion-input [(ngModel)]="nc.horaFin" name="horaFin" maxlength="2" type="tel" placeholder="0" required></ion-input>
            </ion-item>
            <br>
              <ion-item lines="none">
                <div style="display: flex;flex-direction: column;width: 100%;">
                  <ion-label style="color:gray; font-size: 14px;margin-top:16px;margin-bottom: 5px;">Horario</ion-label>
                  <div>
                    <ion-segment (ionChange)="segmentChanged($event)" name="horario" type="text" [(ngModel)]="nc.horario"
                      required>
                      <ion-segment-button value="M">
                        <ion-label>Matutino</ion-label>
                      </ion-segment-button>
                      <ion-segment-button value="V">
                        <ion-label>Vespertino</ion-label>
                      </ion-segment-button>
                    </ion-segment>
                  </div>
                </div>
              </ion-item>
              <ion-item lines="none">
                <ion-label position="stacked" style="color:#0f172a; font-weight:700; font-size:12px; margin-bottom:6px;">Cantidad de personas</ion-label>
                <ion-input [(ngModel)]="nc.personas" name="personas" type="tel" maxlength="2" placeholder="0" required></ion-input>
              </ion-item>
              <ion-item lines="none">
                <ion-label position="stacked" style="color:#0f172a; font-weight:700; font-size:12px; margin-bottom:6px;">Coach</ion-label>
                <ion-select [(ngModel)]="idUs" [required]="true" name="ent" placeholder="Selecciona coach" (ngModelChange)="optionsFn()">
                  @for (option of entrenadores; track option) {
                    <ion-select-option [value]="option.idUsuario">
                      {{ option.nombre }}
                    </ion-select-option>
                  }
                </ion-select>
              </ion-item>
              <ion-item lines="none" button detail="false" (click)="openPicker(fechaInput)">
                <ion-label position="stacked" style="color:#0f172a; font-weight:700; font-size:12px; margin-bottom:6px;">Fecha</ion-label>
                <ion-input #fechaInput name="dia" type="date" [(ngModel)]="nc.dia" required style="pointer-events: none;"></ion-input>
              </ion-item>
            </div>
            <br>
              <div>
                <ion-row>
                  <ion-col>
                    <ion-button (click)="nuevaClase(claseNueva)" size="large" type="submit" expand="block"
                    class="btndorado">Agregar</ion-button>
                  </ion-col>
                </ion-row>
              </div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </form>

    </ion-content>
