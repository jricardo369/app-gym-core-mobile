<ion-header class="ion-no-border">
  <ion-toolbar >
    <ion-title class="dorado ">Cambiar contraseña</ion-title>
    <ion-buttons slot="start">
      <ion-back-button class="dorado " defaultHref="" (click)="atras()" text=""></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="contenido">
  <form #cambiarPass="ngForm" novalidate>
    <ion-grid>
      <ion-row>
        <ion-col size-md="6" size-lg="5" size-xs="12">
          <div padding>

            <div style="text-align:center;">
              @if (compania === 'iroda') {
                <ion-img style="margin-bottom: 15px;" src='assets/img/reset-password.png'></ion-img>
              }
              @if (compania === 'lua') {
                <ion-img style="margin-bottom: 15px;" src='assets/img/pr1.png' ></ion-img>
              }
              <label>Ingresa los datos para poder resetear tu contraseña</label>
            </div>
            <div class="profile-field">
              <label class="profile-label">Contraseña anterior</label>
              <div class="profile-input-wrap">
                <ion-icon name="lock-closed-outline" class="profile-input-icon" aria-hidden="true"></ion-icon>
                <ion-input [(ngModel)]="cp.contraseniaAnterior" name="contraseniaAnterior" type="password" required>
                </ion-input>
              </div>
            </div>
            <div class="profile-field">
              <label class="profile-label">Contraseña nueva</label>
              <div class="profile-input-wrap">
                <ion-icon name="lock-closed-outline" class="profile-input-icon" aria-hidden="true"></ion-icon>
                <ion-input [(ngModel)]="cp.contraseniaNueva" name="contrasenia" type="password" maxlength="11" required>
                </ion-input>
              </div>
            </div>
            <div class="profile-field">
              <label class="profile-label">Confirmar contraseña</label>
              <div class="profile-input-wrap">
                <ion-icon name="lock-closed-outline" class="profile-input-icon" aria-hidden="true"></ion-icon>
                <ion-input [(ngModel)]="cp.confirmarpass" name="contraseniaNueva" type="password" maxlength="11" required>
                </ion-input>
              </div>
            </div>
          </div>
          <br>
            <br>
              <div>
                <ion-button class="btndorado" (click)="passNuevo(cambiarPass)" size="large" type="submit"
                expand="block">Cambiar</ion-button>
              </div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </form>
    </ion-content>
